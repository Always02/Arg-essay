*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1240px;margin:auto;padding:0 26px 60px}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);margin-bottom:30px}.brand{font-size:19px;font-weight:650;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:450;letter-spacing:1px;margin-top:-3px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{padding:10px 15px;border-radius:999px;background:transparent;color:var(--ink);font-size:14px}.nav button.active{background:#1d1d1f;color:#fff}.btn.primary{background:var(--accent);color:white}.btn.secondary{background:var(--soft)}.btn.outline{border:1px solid var(--line);background:white}.btn.danger{color:var(--danger);background:#fff0ef}.btn.small{padding:7px 11px;font-size:13px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:12px 0 26px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase}.hero h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.5px;line-height:1.15;margin:8px 0}.hero p{margin:10px 0 0;color:var(--muted);max-width:620px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-12{grid-column:span 12}.section-title{font-size:19px;letter-spacing:-.4px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.input,textarea,select{width:100%;border:1px solid #d8d8dc;border-radius:11px;padding:11px 12px;background:white;color:var(--ink);outline:none}.input:focus,textarea:focus,select:focus{border-color:#8caaf7;box-shadow:0 0 0 3px #eaf0ff}textarea{resize:vertical;min-height:110px;line-height:1.75}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:#424245;font-weight:550}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.item h3{margin:0 0 5px;font-size:16px;line-height:1.45}.item p{margin:7px 0;color:#4c4c50;white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:var(--soft);color:#55555b;font-size:11px;margin:2px 4px 2px 0}.empty{padding:35px 18px;text-align:center;color:var(--muted);border:1px dashed #d8d8dc;border-radius:14px}.tabs{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:12px;width:max-content;max-width:100%;flex-wrap:wrap}.tabs button{padding:8px 12px;border-radius:9px;background:transparent;color:#55555b;font-size:13px}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0000000d}.split{display:grid;grid-template-columns:minmax(250px, .8fr) minmax(0,1.5fr);gap:18px}.sticky{position:sticky;top:16px;align-self:start}.answer-box{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:15px;white-space:pre-wrap;line-height:1.8}.muted-box{background:#f7f7f8;border-radius:12px;padding:13px;color:#515158}.notice{border-radius:12px;padding:12px 14px;background:#f0f5ff;color:#254b9b;font-size:13px}.warning{background:#fff8e8;color:#825b13}.hide{display:none!important}.divider{height:1px;background:var(--line);margin:18px 0}.metric{font-size:28px;font-weight:650;letter-spacing:-1px}.footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:auto}.inline-actions{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 16px;background:#1d1d1f;color:#fff;border-radius:999px;box-shadow:var(--shadow);z-index:10;font-size:13px;max-width:90vw}.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.devbanner{background:#fff8e8;color:#825b13;border:1px solid #f0d9a8;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:13px}.skillgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.skillcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa;font-size:12px;line-height:1.6}.skillcard strong{display:block;font-size:13px;margin-bottom:4px;color:var(--ink)}
@media(max-width:800px){.shell{padding:0 14px 36px}.topbar{height:auto;padding:15px 0;align-items:flex-start;flex-direction:column;margin-bottom:22px}.nav{width:100%}.nav button{flex:1}.hero{align-items:flex-start;flex-direction:column}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.split{grid-template-columns:1fr}.sticky{position:static}.panel{padding:17px}.two,.three{grid-template-columns:1fr}.item-head{flex-direction:column}.toolbar>*{flex:1}.toolbar .btn{flex:0 0 auto}.skillgrid{grid-template-columns:1fr}}

<script>
(() => {
'use strict';
const KEY='zhixing_study_site_v3';

/* ===================== 内置主题库 ===================== */
const THEMES=[
  {name:'基层治理',kw:['基层治理','社区治理','网格化','基层减负','乡村治理','社会治理','枫桥经验','矛盾调解','居委会','村委会','下沉','属地管理','基层干部']},
  {name:'乡村振兴',kw:['乡村振兴','三农','农业','农村','农民','粮食安全','耕地','产业帮扶','和美乡村','驻村','集体经济','特色农业','返乡']},
  {name:'营商环境',kw:['营商环境','放管服','政务服务','市场主体','民营经济','中小企业','减税降费','一网通办','证照分离','招商引资','企业负担']},
  {name:'数字经济',kw:['数字经济','数字化','数字政府','平台经济','数据要素','人工智能','互联网+','智能制造','产业数字化','直播电商','大数据']},
  {name:'科技创新',kw:['科技创新','科技自立自强','关键核心技术','研发','专利','实验室','科技成果转化','人才','卡脖子','新质生产力','基础研究']},
  {name:'就业创业',kw:['就业','创业','稳就业','灵活就业','高校毕业生','职业技能','招聘','劳动者','新就业形态','零工']},
  {name:'教育发展',kw:['教育','义务教育','双减','职业教育','高等教育','教育公平','教师','学生','校园','考试','家校']},
  {name:'医疗卫生',kw:['医疗','卫生','医院','医保','基层医疗','公共卫生','药品','就医','分级诊疗','健康中国','疾病']},
  {name:'养老托育',kw:['养老','老龄','托育','婴幼儿','老年人','社区养老','护理','生育','养老服务','银发']},
  {name:'社会保障',kw:['社会保障','社保','低保','救助','残疾人','福利','共同富裕','分配','慈善','兜底']},
  {name:'区域协调',kw:['区域协调','城市群','城镇化','县域','城乡融合','一体化','长三角','京津冀','大湾区','西部','东北','中部崛起']},
  {name:'绿色发展',kw:['绿色','低碳','碳达峰','碳中和','新能源','节能','循环经济','绿色转型','双碳','清洁能源']},
  {name:'生态文明',kw:['生态','环境','污染防治','河长制','大气','水质','生物多样性','国土','环保督察','垃圾分类','美丽中国']},
  {name:'文化建设',kw:['文化','文化产业','传统文化','非遗','文化自信','文旅','公共文化','文明','文艺','文化遗产','书香']},
  {name:'公共安全',kw:['安全','应急','防灾','减灾','安全生产','消防','食品药品','事故','风险防控','韧性城市','防汛']},
  {name:'法治建设',kw:['法治','依法','执法','司法','立法','普法','法律','行政','权责','合规','公平正义']},
  {name:'国际合作',kw:['国际合作','对外开放','一带一路','外贸','外资','全球化','命运共同体','自贸','进出口','国际']},
  {name:'党的建设',kw:['党建','党组织','党员干部','作风','廉政','反腐','主题教育','组织建设','基层党建','巡视']},
  {name:'消费市场',kw:['消费','内需','市场','价格','旅游消费','以旧换新','服务业','流通','供给侧','需求侧']},
  {name:'住房城乡建设',kw:['住房','房地产','保障房','城市更新','老旧小区','物业','城市管理','公积金','棚改','城乡建设']},
];
const THEME_NAMES=THEMES.map(t=>t.name).concat(['无主题']);
function detectTheme(text){
  const t=String(text||'').toLowerCase();let best='无主题',bestScore=0;
  for(const th of THEMES){let s=0;for(const k of th.kw){if(t.includes(k.toLowerCase()))s+=k.length>=4?2:1}if(s>bestScore){bestScore=s;best=th.name}}
  return best;
}

/* ===================== 五类题型：出题箩筐 ===================== */
/* 每类包含若干“题目模板”，用 {kw} 注入从文本提取的关键词，{theme} 为主题 */
const QUESTION_BANK={
  '归纳概括':[
    '请根据本文，概括“{kw}”的主要做法/举措。要求：全面、准确，不超过250字。',
    '请概括本文中与“{theme}”相关的主要问题及其表现。要求：条理清晰，不超过300字。',
    '请梳理本文反映的“{kw}”的成效与经验。要求：分条作答，不超过250字。'
  ],
  '综合分析':[
    '请结合本文，谈谈你对“{kw}”这一表述的理解。要求：观点明确，分析透彻，不超过300字。',
    '请对本文中“{kw}”这一现象进行分析，谈谈你的看法。要求：有理有据，不超过350字。',
    '请分析“{kw}”产生的原因及其影响。要求：层次分明，不超过300字。'
  ],
  '提出对策':[
    '针对本文反映的“{kw}”问题，请提出具体可行的对策建议。要求：针对性强、切实可行，不超过300字。',
    '请就如何进一步推进“{theme}”工作，提出你的建议。要求：分条列出，不超过350字。',
    '假如你是相关部门工作人员，请针对本文中的“{kw}”问题提出解决措施。要求：措施具体，不超过300字。'
  ],
  '贯彻执行':[
    '请根据本文，就“{theme}”工作拟写一份倡议书。要求：格式规范，内容具体，不超过500字。',
    '请以相关部门名义，就“{kw}”问题写一份工作汇报提纲。要求：条理清楚，不超过400字。',
    '请根据本文，就“{theme}”主题写一篇短评。要求：观点鲜明，语言得体，不超过400字。'
  ],
  '申发论述':[
    '请结合本文，围绕“{theme}”主题，自拟题目，写一篇议论文。要求：观点明确，论证充分，800—1000字。',
    '请以“{kw}”为话题，联系实际，自选角度，写一篇文章。要求：立意深刻，结构完整，800—1000字。'
  ]
};
const QUESTION_TYPES=Object.keys(QUESTION_BANK);
function pickKeywords(text){
  const t=String(text||'');
  const theme=detectTheme(t);
  const th=THEMES.find(x=>x.name===theme);
  const kws=[];
  if(th){for(const k of th.kw){if(t.includes(k)&&k.length>=2)kws.push(k)}}
  // 补充高频四字词/政策短语
  const freq={};
  const words=t.match(/[\u4e00-\u9fa5]{4,8}/g)||[];
  for(const w of words){if(/^(我们|他们|可以|通过|进行|这个|一个|没有|已经|以及|但是|因为|所以|如果|就是|这样|什么|如何|什么|这些|那些|还是|只是|不是)/.test(w))continue;freq[w]=(freq[w]||0)+1}
  Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([w])=>{if(!kws.includes(w))kws.push(w)});
  return {theme,kws:kws.slice(0,5)};
}
function generateQuestion(type,text){
  const bank=QUESTION_BANK[type]||QUESTION_BANK['归纳概括'];
  const {theme,kws}=pickKeywords(text);
  const kw=kws[0]||theme;
  const tpl=bank[Math.floor(Math.random()*bank.length)];
  return {type,theme,kw,keywords:kws,text:tpl.replace(/\{kw\}/g,kw).replace(/\{theme\}/g,theme)};
}

/* ===================== 数据 ===================== */
const seed={
  news:[{id:'n1',title:'示例：从一份政策文件开始积累',author:'',category:'政策治理',source:'',date:'',url:'',summary:'',notes:'',content:'',favorite:false,createdAt:Date.now()}],
  questions:[{id:'q1',title:'示例题：概括基层治理的主要举措',type:'归纳概括',year:'练习示例',region:'自建题目',points:[{text:'完善基层治理机制',score:2},{text:'加强部门协同',score:2},{text:'强化监督问责',score:3},{text:'健全长效保障',score:3}],paperId:'p1',materials:'【材料示例】请在此处录入申论给定材料。',prompt:'根据给定材料，概括基层治理的主要举措。',reference:'【参考答案示例】\n一是完善基层治理机制。\n二是加强部门协同，推动信息共享与工作联动。\n三是强化监督问责，确保政策落实。\n四是健全长效保障机制。',rubric:'总分10分。按踩分点给分；意思相近可视为命中，注意结合材料判断。',maxScore:10,createdAt:Date.now()}],
  papers:[{id:'p1',title:'我的第一套练习卷（示例）',year:'练习示例',region:'自建',notes:'可把题目关联到试卷。删除示例后添加自己的试卷。'}],
  attempts:[],
  practiceDrafts:{},
  settings:{showAnswer:true,themeNames:THEME_NAMES.slice()},
  activeQuestionId:'q1',activePaperId:'p1'
};
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.news)&&Array.isArray(x.questions))return {...seed,...x,settings:{...seed.settings,...x.settings}}}catch(e){}return structuredClone(seed)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('保存失败：浏览器存储空间可能不足，请先导出备份。');}}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=prefix=>prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hide'),2800)}
function fmtDate(v){return v?new Date(v).toLocaleDateString('zh-CN'):'未填写日期'}
function activePage(){return document.querySelector('.nav button.active')?.dataset.page||'news'}
function setPage(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(){const page=activePage();if(page==='news')renderNews();else if(page==='essay')renderEssay();else if(page==='library')renderLibrary();else renderSettings()}
function themeOptions(selected){
  const names=(db.settings.themeNames&&db.settings.themeNames.length?db.settings.themeNames:THEME_NAMES);
  return names.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')+(names.includes(selected)?'':`<option selected>${esc(selected||'无主题')}</option>`);
}

/* ===================== PDF 文字提取 ===================== */
let pdfLibPromise=null;
function loadPdfLib(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfLibPromise)return pdfLibPromise;
  pdfLibPromise=new Promise((resolve,reject)=>{
    const urls=['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'];
    let i=0;
    const tryLoad=()=>{
      if(i>=urls.length){reject(new Error('PDF 解析库加载失败'));return}
      const s=document.createElement('script');s.src=urls[i++];
      s.onload=()=>{if(!window.pdfjsLib){tryLoad();return}window.pdfjsLib.GlobalWorkerOptions.workerSrc=s.src.replace('pdf.min.js','pdf.worker.min.js');resolve(window.pdfjsLib)};
      s.onerror=tryLoad;document.head.appendChild(s);
    };tryLoad();
  });
  return pdfLibPromise;
}
async function extractPdfText(file,onProgress){
  const lib=await loadPdfLib();
  const buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:buf}).promise;
  const pages=[];const total=doc.numPages;
  for(let p=1;p<=total;p++){
    const page=await doc.getPage(p);const content=await page.getTextContent();
    let lastY=null,line=[],lines=[];
    for(const it of content.items){if(!it.str)continue;const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>3){lines.push(line.join(''));line=[]}line.push(it.str);lastY=y}
    if(line.length)lines.push(line.join(''));pages.push(lines.join('\n'));if(onProgress)onProgress(Math.round(p/total*100));
  }
  return {text:pages.join('\n\n'),pages:total};
}
function cleanText(t){return String(t||'').replace(/\r\n?/g,'\n').replace(/[ \t\u3000]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
function guessMetaFromText(text){
  const t=String(text||'');const meta={title:'',author:'',source:'',date:''};
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const badTitle=/^(给定资料|材料|作答要求|问题|一、|二、|三、|第[一二三四五六七八九十]|【)/;
  for(const l of lines.slice(0,12)){if(l.length>=6&&l.length<=40&&!badTitle.test(l)&&!/[。；：，]$/.test(l)){meta.title=l;break}}
  let m=t.match(/(?:作者|文\/|文：|撰稿|记者)[:：\s]*([\u4e00-\u9fa5A-Za-z·]{2,20})/);if(m)meta.author=m[1].trim();
  m=t.match(/(?:来源|来源媒体|刊载于|发表于|转载自)[:：\s]*([^\n，。；]{2,30})/);if(m)meta.source=m[1].trim();
  if(!meta.source){const media=['新华社','人民日报','光明日报','经济日报','半月谈','求是','中国政府网','央视新闻','中国新闻网','澎湃新闻','南方日报','学习强国'];for(const k of media){if(t.includes(k)){meta.source=k;break}}}
  m=t.match(/(20\d{2})\s*[-年./]\s*(\d{1,2})\s*[-月./]\s*(\d{1,2})/);
  if(m){meta.date=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}
  return meta;
}
function guessTitleOnly(text){const lines=cleanText(text).split('\n').map(l=>l.trim()).filter(Boolean);const bad=/^(给定资料|材料|作答要求|问题|一、|二、|三、|第[一二三四五六七八九十]|【)/;for(const l of lines.slice(0,10)){if(l.length>=4&&l.length<=40&&!bad.test(l))return l}return lines[0]?lines[0].slice(0,30):''}

/* ===================== 申论：PDF 题目提取规则（测试中） ===================== */
function parseEssayPaper(text,fileName){
  const lines=cleanText(text).split('\n');const joined=lines.join('\n');
  const res={paper:{id:id('p'),title:'',year:'',region:'',notes:'PDF 导入：'+fileName},questions:[]};
  const y=joined.match(/(20\d{2})\s*年/);if(y)res.paper.year=y[1]+'年';
  const regions=['国考','省考','联考','北京','上海','天津','重庆','河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','内蒙古','深圳','广州'];
  for(const r of regions){if(joined.includes(r+'申论')||joined.includes(r+'省考')||(r==='国考'&&joined.includes('国考'))){res.paper.region=r;break}}
  res.paper.title=(y?y[1]+'年':'')+(res.paper.region||'')+'申论试卷（PDF导入）';
  const qStartPatterns=[/^[\s【\[]*第[一二三四五六七八九十\d]+题[】\]]?/,/^[\s【\[]*问题[一二三四五六七八九十\d]+[】\]]?/,/^[\s]*[一二三四五六七八九十]+、/,/^[\s]*\d+[.．、]/];
  const ansRequireIdx=lines.findIndex(l=>/^[\s【\[]*(作答要求|答题要求)/.test(l));
  const startIdx=ansRequireIdx>=0?ansRequireIdx:0;
  let current=null;const chunks=[];
  for(let i=startIdx;i<lines.length;i++){
    const l=lines[i];const isStart=qStartPatterns.some(p=>p.test(l.trim()))&&l.trim().length<60;
    if(isStart){if(current)chunks.push(current);current={head:l.trim(),body:[]}}else if(current){current.body.push(l)}
  }
  if(current)chunks.push(current);
  if(!chunks.length){const segs=joined.split(/(?=请(?:根据|结合|依据|概括|分析|谈谈|就|以))/g).filter(s=>s.trim().length>20);segs.forEach((s,i)=>chunks.push({head:`第${i+1}题`,body:[s]}))}
  chunks.forEach((c,idx)=>{
    const bodyText=c.body.join('\n').trim();if(!bodyText&&c.head.length<10)return;
    let prompt=(c.head.replace(/^[\s【\[]*(第[一二三四五六七八九十\d]+题|问题[一二三四五六七八九十\d]+|[一二三四五六七八九十]+、|\d+[.．、])[】\]]?\s*/,'')+'\n'+bodyText).trim();
    let maxScore=20;const sm=bodyText.match(/[（(]?\s*(\d{1,2})\s*分\s*[)）]?/);if(sm)maxScore=Number(sm[1]);
    const wm=bodyText.match(/(\d{2,4})\s*[字词]/);const words=wm?wm[1]:'';
    let type='其他';const pt=prompt+'\n'+bodyText;
    if(/概括|归纳|概述|梳理/.test(pt))type='归纳概括';
    else if(/分析|谈谈.*理解|谈谈.*看法|评析|解释/.test(pt))type='综合分析';
    else if(/提出.*对策|建议|措施|怎么办|如何解决/.test(pt))type='提出对策';
    else if(/贯彻执行|公文|倡议书|讲话稿|宣传稿|汇报|简报|方案|公开信|短评/.test(pt))type='贯彻执行';
    else if(/文章|作文|议论文|论述|自拟题目/.test(pt))type='申发论述';
    const title=(c.head.replace(/^[\s【\[]*[】\]]?/,'').slice(0,40)||`第${idx+1}题`);
    res.questions.push({id:id('q'),title:title.length>24?title.slice(0,24)+'…':title,type,year:res.paper.year,region:res.paper.region,paperId:res.paper.id,materials:'',prompt,maxScore,words,points:[],reference:'',rubric:'',createdAt:Date.now()});
  });
  if(res.questions.length===0){res.questions.push({id:id('q'),title:'未自动拆分：请编辑',type:'其他',year:res.paper.year,region:res.paper.region,paperId:res.paper.id,materials:'',prompt:cleanText(text).slice(0,2000),maxScore:20,points:[],reference:'',rubric:'',createdAt:Date.now()})}
  return res;
}

/* ===================== 申论训练页（含测试说明 + 技巧） ===================== */
const SKILLS={
'归纳概括':{技巧:'审题定对象→材料找要点→同类合并→规范表述。盯高频词、观点句、逻辑分层词；每条用观点句领起，动宾结构，一条只说一个意思。',必掌握:'区分作答对象（问题/原因/做法/影响）；案例型材料按“主体+处境+做法+结果+启示”提炼，数据型看对比，观点型抓结论。'},
'综合分析':{技巧:'解释型：总—分—总（释义→多角度分析→总结）。评价型：先依据材料明确表态→分析论证→收口。启示型：总—分，把具体做法泛化为可推广经验。',必掌握:'本质是“归纳概括+逻辑”；要点仍来自材料，不凭空发挥；用序号和关联词把层次撑开。'},
'提出对策':{技巧:'对策三标准：针对问题、可行、可落地。材料直接有的提炼，只有问题/原因的用反推；每条“核心做法+具体展开（主体+手段+内容+客体+结果）”。',必掌握:'题干问题不明确时先用一句话总括问题；紧急事件先控局再追责再长效机制；活动整治按“小组→调研→整治→长效”流程。'},
'贯彻执行':{技巧:'审题三问：我是谁、写给谁、为什么写。格式=标题（关于+事由+的+文种）+称谓+正文（开头/主体占80%/结尾）+落款；提纲、讲话稿、短评通常不要落款。',必掌握:'常见文种格式差异（讲话稿、倡议书、简报、通知）；语言不能串味：倡议书有号召力，通知正式，讲话稿偏口语。'},
'申发论述':{技巧:'五段三分；开头=背景/现象+问题+分析+总论点；分论点靠案例展开（主体+处境+做法+结果+启示，或正反对比）；结尾从主题实际意义收。',必掌握:'立意必须来自材料；积累感动中国人物、七一勋章获得者、优秀基层干部、近一年热点，每个能用2—3句概括“谁+做了什么+结果+说明什么”。'}
};

  <div class="list">${res.questions.map((q,i)=>`<div class="item"><div class="item-head"><div><span class="tag">${esc(q.type)}</span><span class="tag">${q.maxScore}分</span><h3>${esc(q.title)}</h3></div></div><textarea rows="4" data-iq="${i}" placeholder="题干">${esc(q.prompt)}</textarea></div>`).join('')}</div>

    res.paper.year=$('#essayImportYear').value.trim();res.paper.region=$('#essayImportRegion').value.trim();
    res.questions.forEach(q=>{q.year=res.paper.year;q.region=res.paper.region});
    box.querySelectorAll('[data-iq]').forEach(t=>{const i=Number(t.dataset.iq);if(res.questions[i])res.questions[i].prompt=t.value.trim()});
    db.papers.unshift(res.paper);db.questions=res.questions.concat(db.questions);

function renderEssayCatalog(){
const q=($('#essaySearch')?.value||'').toLowerCase(),mode=window.essayMode||'papers',el=$('#essayCatalog');if(!el)return;
if(mode==='papers'){
const papers=db.papers.filter(p=>[p.title,p.year,p.region,p.notes].join(' ').toLowerCase().includes(q));
el.innerHTML=papers.length?`<div class="list">${papers.map(p=>{const qs=db.questions.filter(x=>x.paperId===p.id);return `<article class="item"><div class="item-head"><div><h3>${esc(p.title)}</h3><div class="sub">${esc(p.year||'未标年份')} · ${esc(p.region||'未标地区')} · ${qs.length} 道题</div></div><div class="inline-actions"><button class="btn small outline" data-open-paper="${p.id}">查看试卷</button><button class="btn small outline" data-edit-paper="${p.id}">编辑</button><button class="btn small danger" data-del-paper="${p.id}">删除</button></div></div>${p.notes?`<p>${esc(p.notes)}</p>`:''}</article>`}).join('')}</div>`:'<div class="empty">还没有试卷。新建试卷后，可以把题目关联到试卷。</div>';
el.querySelectorAll('[data-open-paper]').forEach(b=>b.onclick=()=>{db.activePaperId=b.dataset.openPaper;const first=db.questions.find(q=>q.paperId===b.dataset.openPaper);if(first)db.activeQuestionId=first.id;save();renderWorkbench();toast('已打开试卷')});
el.querySelectorAll('[data-edit-paper]').forEach(b=>b.onclick=()=>paperForm(b.dataset.editPaper));
el.querySelectorAll('[data-del-paper]').forEach(b=>b.onclick=()=>{const pid=b.dataset.delPaper;if(confirm('删除试卷不会删除其中题目，只会解除关联。确定吗？')){db.papers=db.papers.filter(p=>p.id!==pid);db.questions.forEach(q=>{if(q.paperId===pid)q.paperId=''});save();renderEssay()}});
}else{
const qs=db.questions.filter(x=>[x.title,x.type,x.year,x.region,x.prompt].join(' ').toLowerCase().includes(q));
el.innerHTML=qs.length?`<div class="list">${qs.map(x=>`<article class="item"><div class="item-head"><div><h3>${esc(x.title)}</h3><div>${[x.type,x.year,x.region].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="inline-actions"><button class="btn small primary" data-work="${x.id}">开始作答</button><button class="btn small outline" data-edit-q="${x.id}">编辑</button><button class="btn small danger" data-del-q="${x.id}">删除</button></div></div><p>${esc(x.prompt)}</p></article>`).join('')}</div>`:'<div class="empty">没有找到题目。可以添加单题，或导入 JSON / PDF。</div>';
el.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{db.activeQuestionId=b.dataset.work;save();renderWorkbench();document.querySelector('#workbench').scrollIntoView({behavior:'smooth',block:'start'})});
el.querySelectorAll('[data-edit-q]').forEach(b=>b.onclick=()=>questionForm(b.dataset.editQ));
el.querySelectorAll('[data-del-q]').forEach(b=>b.onclick=()=>deleteQuestion(b.dataset.delQ));
}
}
function paperForm(pid){const p=db.papers.find(x=>x.id===pid)||{title:'',year:'',region:'',notes:''};const box=$('#questionEditor');box.classList.remove('hide');box.innerHTML=`<h2 class="section-title">${pid?'编辑试卷':'新建试卷'}</h2><form id="paperForm"><div class="field"><label>试卷名称 *</label><input class="input" name="title" required value="${esc(p.title)}"></div><div class="two"><div class="field"><label>年份</label><input class="input" name="year" value="${esc(p.year)}"></div><div class="field"><label>地区/考试类型</label><input class="input" name="region" value="${esc(p.region)}"></div></div><div class="field"><label>备注</label><textarea name="notes">${esc(p.notes)}</textarea></div><button class="btn primary">保存试卷</button> <button type="button" class="btn outline" id="cancelPaper">取消</button></form>`;
$('#cancelPaper').onclick=()=>box.classList.add('hide');$('#paperForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={id:pid||id('p'),title:f.get('title').trim(),year:f.get('year').trim(),region:f.get('region').trim(),notes:f.get('notes').trim()};if(pid)db.papers=db.papers.map(x=>x.id===pid?o:x);else db.papers.unshift(o);save();box.classList.add('hide');renderEssay();toast('试卷已保存')}}

<form id="questionForm"><div class="field"><label>题目名称 *</label><input class="input" name="title" required value="${esc(q.title)}"></div>
<div class="three"><div class="field"><label>题型</label><select name="type">${QUESTION_TYPES.map(x=>`<option ${x===q.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>年份</label><input class="input" name="year" value="${esc(q.year)}"></div><div class="field"><label>地区/考试类型</label><input class="input" name="region" value="${esc(q.region)}"></div></div>

<div class="field"><label>踩分点（每行一条：分值 | 要点）</label><textarea name="points" rows="5" placeholder="2 | 完善基层治理机制&#10;3 | 加强部门协同">${esc(q.points.map(p=>`${p.score} | ${p.text}`).join('\n'))}</textarea></div>
<div class="two"><div class="field"><label>总分</label><input class="input" type="number" min="1" max="100" name="maxScore" value="${esc(q.maxScore)}"></div><div class="field"><label>评分说明</label><input class="input" name="rubric" value="${esc(q.rubric)}"></div></div>

$('#questionForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const points=String(f.get('points')).split('\n').map(line=>{const m=line.match(/^\s*(\d+(?:\.\d+)?)\s*[|｜:：]\s*(.+)$/);return m?{score:Number(m[1]),text:m[2].trim()}:line.trim()?{score:0,text:line.trim()}:null}).filter(Boolean);const o={id:qid||id('q'),title:f.get('title').trim(),type:f.get('type'),year:f.get('year').trim(),region:f.get('region').trim(),paperId:f.get('paperId'),materials:f.get('materials').trim(),prompt:f.get('prompt').trim(),points,reference:f.get('reference').trim(),rubric:f.get('rubric').trim(),maxScore:Number(f.get('maxScore'))||20,createdAt:q.createdAt||Date.now()};if(qid)db.questions=db.questions.map(x=>x.id===qid?o:x);else db.questions.unshift(o);db.activeQuestionId=o.id;save();box.classList.add('hide');renderEssay();toast('题目已保存')}}

al.querySelectorAll('[data-delete-attempt]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这条作答记录？')){db.attempts=db.attempts.filter(a=>a.id!==b.dataset.deleteAttempt);save();renderWorkbench()}});
}
function buildGradingPrompt(q,answer){return `请你作为申论阅卷与辅导老师，严格依据我提供的题目、材料、评分细则和踩分点批改。不要因为措辞不同就机械扣分；判断是否表达了相同含义时，要结合材料。请给出有依据的估分，不要虚构评分标准。若标准答案或材料不足以支持判断，请明确说明不确定性。\n\n【题目】\n${q.title}\n${q.prompt}\n\n【给定材料】\n${q.materials||'（未提供）'}\n\n【总分】\n${q.maxScore}\n\n【踩分点及分值】\n${q.points.length?q.points.map((p,i)=>`${i+1}. ${p.score}分：${p.text}`).join('\n'):'（未提供，请说明评分依据的不确定性）'}\n\n【评分说明】\n${q.rubric||'请按踩分点核对，并说明给分依据。'}\n\n【我的答案】\n${answer}\n\n【参考答案（用于对照，请勿直接以措辞差异扣分）】\n${q.reference||'（未提供）'}\n\n请按以下结构输出：\n1. 总分估计（满分${q.maxScore}分）及估分把握程度；\n2. 踩分点逐项表格：要点、分值、命中情况（命中/部分命中/未命中）、我的答案对应原句、得分理由；\n3. 主要失分原因，区分内容遗漏、逻辑结构、材料依据、表达问题；\n4. 最小修改方案：尽量保留我原答案，只指出最值得补充或修改的地方；\n5. 一份修改后的参考作答；\n6. 最后原样附上我提供的参考答案。\n请避免空泛鼓励，给分务必可解释。`}
function copy(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch(e){prompt('请手动复制以下内容：',text)}t.remove()}

function renderLibrary(){
$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">LIBRARY</div><h1>所有资料，集中管理。</h1><p>导入题库、导出整站备份，也可以只导出新闻或申论资料。</p></div></section>
<div class="grid"><section class="panel span-6"><h2 class="section-title">题库导入</h2><p class="sub">支持本网站 JSON 备份，也支持约定格式的独立题库 JSON；申论试卷 PDF 导入为测试功能。</p><button class="btn primary" id="libImport">选择 JSON 文件</button> <button class="btn secondary" id="libPdf">从 PDF 导入申论试卷（测试）</button><div class="divider"></div><h3>独立题库格式示例</h3><pre class="answer-box" style="white-space:pre-wrap;overflow:auto;font-size:12px">{

  }]
}</pre></section>
<section class="panel span-6"><h2 class="section-title">导出与备份</h2><p class="sub">导出后请妥善保存文件。换浏览器或清理浏览器数据前，先导出备份。</p><div class="list"><button class="btn secondary" id="exportAll">导出全部数据（JSON）</button><button class="btn secondary" id="exportNews">仅导出时政阅读</button><button class="btn secondary" id="exportEssay">仅导出申论题库与作答</button><button class="btn outline" id="downloadTemplate">下载空白题库模板</button></div><div class="divider"></div><div class="notice warning">数据保存在当前浏览器中，不会自动同步到手机或另一台电脑。请定期备份。</div></section></div>`;
$('#libImport').onclick=()=>$('#importFile').click();$('#libPdf').onclick=()=>{pdfTarget='essay';$('#pdfFile').click()};$('#exportAll').onclick=()=>downloadJSON(db,'zhixing-backup.json');$('#exportNews').onclick=()=>downloadJSON({news:db.news},'zhixing-news.json');$('#exportEssay').onclick=()=>downloadJSON({papers:db.papers,questions:db.questions,attempts:db.attempts},'zhixing-essay.json');$('#downloadTemplate').onclick=()=>downloadJSON({papers:[],questions:[]},'zhixing-question-template.json');
}
function renderSettings(){
$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">PREFERENCES</div><h1>让工具适合你的节奏。</h1><p>网站不需要账号，不会把资料上传到服务器。所有数据都留在当前浏览器。</p></div></section><div class="grid">
<section class="panel span-6"><h2 class="section-title">阅读与作答设置</h2><label class="checkline" style="margin-top:18px"><input type="checkbox" id="defaultAnswer" ${db.settings.showAnswer?'checked':''}> 默认显示参考答案</label><p class="sub">这只控制答案区的初始显示状态，不会删除参考答案。</p><div class="divider"></div><h3 class="section-title">主题管理</h3><p class="sub">可添加自定义主题，识别不到的会自动归入「无主题」。</p><div class="toolbar"><input class="input" id="newTheme" placeholder="新主题名称" style="max-width:220px"><button class="btn small primary" id="addTheme">添加主题</button></div><div class="toolbar">${(db.settings.themeNames||THEME_NAMES).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="divider"></div><h3 class="section-title">当前数据概览</h3><div class="three"><div><div class="metric">${db.news.length}</div><div class="sub">篇阅读资料</div></div><div><div class="metric">${db.papers.length}</div><div class="sub">套试卷</div></div><div><div class="metric">${db.questions.length}</div><div class="sub">道题目</div></div></div><p class="sub">历史作答：${db.attempts.length} 条</p></section>
<section class="panel span-6"><h2 class="section-title">关于隐私与限制</h2><div class="list"><div class="item"><strong>本地保存</strong><p>资料使用浏览器 localStorage 保存。无账号系统、无云同步。</p></div><div class="item"><strong>PDF 处理</strong><p>文字版 PDF 可本地提取；扫描图片版需要 OCR，无法直接提取。PDF 解析库首次会尝试从 CDN 加载，之后浏览器会缓存。</p></div><div class="item"><strong>申论写题</strong><p>尚在测试开发，静候发布。当前可用的是阅读后的“出题练习”和题库试用。</p></div><div class="item"><strong>GitHub Pages</strong><p>纯静态网站，可部署在 GitHub Pages。请勿将私人或敏感资料放入公开仓库。</p></div></div><div class="toolbar"><button class="btn danger" id="resetData">恢复初始示例数据</button></div></section></div>`;
$('#defaultAnswer').onchange=e=>{db.settings.showAnswer=e.target.checked;save();toast('设置已保存')};
$('#addTheme').onclick=()=>{const v=$('#newTheme').value.trim();if(!v)return;if(!db.settings.themeNames.includes(v))db.settings.themeNames.push(v);save();renderSettings();toast('主题已添加')};
$('#resetData').onclick=()=>{if(confirm('这会清空当前浏览器内的网站数据并恢复示例数据。请先导出备份。确定继续？')){db=structuredClone(seed);save();render();toast('已恢复示例数据')}};
}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!confirm('导入可能覆盖同类数据。建议先导出备份。继续吗？')){e.target.value='';return}
if(Array.isArray(x.news))db.news=x.news;
if(Array.isArray(x.papers))db.papers=x.papers;
if(Array.isArray(x.questions))db.questions=x.questions.map(q=>({...q,id:q.id||id('q'),points:Array.isArray(q.points)?q.points:[]}));
if(Array.isArray(x.attempts))db.attempts=x.attempts;
if(x.settings)db.settings={...db.settings,...x.settings};
if(x.activeQuestionId)db.activeQuestionId=x.activeQuestionId;
if(x.activePaperId)db.activePaperId=x.activePaperId;
save();render();toast('导入完成')}catch(err){alert('导入失败：文件不是有效的 JSON，或格式不正确。')}e.target.value=''};
window.addEventListener('beforeunload',()=>save());
render();
})();
</script>
